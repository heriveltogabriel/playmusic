<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="/static/playvinil-favicon.png?v=2" type="image/png">
  <link rel="manifest" href="static/gravar-manifest.json?v=4.6.9">
  <link rel="apple-touch-icon" href="/static/logo_lp_da_semana.png">
  <meta name="apple-mobile-web-app-title" content="Gravar LP">
  <title>PlayVinil · Modo gravação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=4.5.7">
  <link rel="stylesheet" href="/static/gravar.css?v=4.10.2">
</head>
<body class="escolhendo">
  <!-- Passo 1: escolher o disco -->
  <section id="escolha" class="escolha">
    <header class="escolha-topo">
      <div class="escolha-titulo">
        <h1>Modo gravação</h1>
        <p>Escolha o disco que vai gravar. A tela fica parada, sem Shazam e sem mostrar as músicas.</p>
      </div>
      <a class="btn-voltar" href="/" aria-label="Voltar para a tela inicial" title="Voltar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
      </a>
    </header>
    <button id="usar-atual" class="usar-atual hidden" type="button"></button>
    <input id="busca" class="busca" type="search" placeholder="Buscar por disco ou artista..." autocomplete="off">
    <div id="lista" class="lista"></div>
    <div id="lados" class="lados hidden"></div>
  </section>

  <!-- Passo 2: as duas telas que alternam (v4.8.0: versão para câmera — a tela aparece pequena
       no vídeo, então pouca coisa, bem grande, e o fundo na cor da capa) -->
  <section id="palco" class="palco hidden" aria-live="off">
    <div id="fundo" class="cam-fundo" aria-hidden="true"></div>
    <div class="cam-sombra" aria-hidden="true"></div>

    <!-- Tela 1: capa grande com o disco saindo de trás, artista enorme -->
    <main id="tela-capa" class="tela visivel cam-tela">
      <div class="cam-disco-area">
        <div class="cam-vinil"><div class="vinyl-disc-inner gira"><div id="rotulo" class="vinyl-label"></div></div></div>
        <img id="capa" class="cam-capa" alt="">
      </div>
      <div id="bloco" class="cam-texto">
        <p id="rotulo-canal" class="cam-canal">LP DA SEMANA</p>
        <h1 id="banda" class="cam-banda"></h1>
        <p id="album" class="cam-album"></p>
        <div class="cam-lado-linha">
          <span id="lado" class="cam-lado"></span>
          <div id="lado-botoes" class="cam-lado-botoes">
            <button id="lado-anterior" class="cam-btn" type="button" aria-label="Lado anterior" title="Lado anterior">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button id="lado-proximo" class="cam-btn" type="button" aria-label="Próximo lado" title="Próximo lado">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M6 18l8.5-6L6 6zm9-12h2v12h-2z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Tela 2: marca do canal — redondo do logo; ao lado YouTube, Instagram, curta e compartilhe (v4.8.3) -->
    <div id="tela-marca" class="tela cam-tela">
      <div class="cam-disco-area cam-disco-marca">
        <div id="rotulo-marca" class="cam-logo-redondo" role="img" aria-label="LP da Semana"></div>
      </div>
      <div class="cam-redes-col">
        <div class="cam-rede">
          <div class="cam-rede-icone yt">
            <img class="icone-oficial" src="/static/gravar/youtube.png" alt="">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.5 6.2v11.6L18 12z"/></svg>
          </div>
          <div class="cam-rede-textos"><span class="cam-rede-titulo">Inscreva-se</span><span class="cam-rede-sub">no YouTube</span></div>
        </div>
        <div class="cam-rede">
          <div class="cam-rede-icone ig">
            <img class="icone-oficial" src="/static/gravar/instagram.png" alt="">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.6" fill="currentColor"/></svg>
          </div>
          <div class="cam-rede-textos"><span class="cam-rede-titulo">@lpdasemana</span><span class="cam-rede-sub">no Instagram</span></div>
        </div>
        <div class="cam-acoes">
          <div class="cam-acao">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>
            <span>Curta</span>
          </div>
          <div class="cam-acao">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg>
            <span>Compartilhe</span>
          </div>
        </div>
      </div>
    </div>

    <a id="voltar-palco" class="btn-voltar btn-voltar-palco" href="/" aria-label="Voltar para a tela inicial" title="Voltar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
    </a>
    <p id="dica" class="dica">Toque: tela cheia · segurar 2 s: voltar</p>
  </section>
  <script src="/static/silence-detector.js?v=4.5.4" defer></script>
  <script src="/static/gravar.js?v=4.8.3" defer></script>
</body>
</html>
