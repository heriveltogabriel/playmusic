<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ouvir LP - Registro Rápido</title>
  <!-- Google Fonts: Outfit for sleek modern UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/ouvir.css">
</head>
<body>
  <!-- Ambient background glow representing album colors -->
  <div id="ambient-glow" class="ambient-glow"></div>

  <div class="app-container">
    <header class="header">
      <div class="logo-wrapper">
        <span class="logo-text">LP da Semana</span>
      </div>
      
      <!-- Rounded Spotify-style Search Bar -->
      <div class="search-wrapper">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="O que você quer ouvir hoje?" autocomplete="off" autofocus>
          <button id="clear-search-btn" class="clear-btn" style="display: none;">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <!-- Grid listing all LPs -->
      <div id="ouvir-grid" class="ouvir-grid">
        <!-- Dynamically populated cards -->
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Carregando sua coleção...</p>
        </div>
      </div>
      
      <!-- Empty state when no search matches -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <svg viewBox="0 0 24 24" width="64" height="64" stroke="currentColor" stroke-width="1.5" fill="none">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
        <h3>Nenhum disco encontrado</h3>
        <p>Tente buscar por outro artista ou título.</p>
      </div>
    </main>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/ouvir.js"></script>
</body>
</html>
