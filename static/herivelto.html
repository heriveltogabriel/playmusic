<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herivelto Gabriel | Links</title>
  <!-- SEO & Icons -->
  <link rel="icon" type="image/png" href="/static/logo_lp_da_semana.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Central de Sistemas e Projetos de Herivelto Gabriel.">
  
  <!-- Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Styling -->
  <link rel="stylesheet" href="/static/herivelto.css">
</head>
<body>
  <div class="profile-container">
    <!-- Top Decorative Banner -->
    <div class="banner">
      <div class="banner-overlay"></div>
    </div>
    
    <!-- Profile Info -->
    <div class="profile-header">
      <div class="avatar-wrapper">
        <img class="profile-avatar" src="/static/avatar.jpg" onerror="this.style.display='none'; document.getElementById('avatar-fallback').style.display='flex';" alt="Herivelto Gabriel">
        <div id="avatar-fallback" class="avatar-fallback">HG</div>
      </div>
      
      <h1 class="profile-name">Herivelto Gabriel</h1>
      <p class="profile-handle">@heriveltogabriel</p>
      <p class="profile-bio">Coleção de LPs, Automação de Áudio & Investimentos</p>
    </div>
    
    <!-- Link List -->
    <div class="links-list">
      <!-- 1. Display Vinyl -->
      <a href="https://150.136.207.62:8080/" class="link-card" id="link-display-vinyl" target="_blank" rel="noopener noreferrer">
        <div class="icon-container">
          <!-- Turntable SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 2a10 10 0 0 1 10 10"></path>
            <path d="M12 12l5-5"></path>
          </svg>
        </div>
        <span class="link-text">Display Vinyl</span>
        <div class="arrow-container">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </a>

      <!-- 2. Minha Coleção -->
      <a href="https://150.136.207.62:8080/admin" class="link-card" id="link-admin" target="_blank" rel="noopener noreferrer">
        <div class="icon-container">
          <!-- Library/Folder Stack SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            <line x1="12" y1="11" x2="12" y2="17"></line>
            <line x1="9" y1="14" x2="15" y2="14"></line>
          </svg>
        </div>
        <span class="link-text">Minha Coleção</span>
        <div class="arrow-container">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </a>

      <!-- 3. Ouvir -->
      <a href="https://150.136.207.62:8080/ouvir" class="link-card" id="link-ouvir" target="_blank" rel="noopener noreferrer">
        <div class="icon-container">
          <!-- Headphones / Soundwave SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
          </svg>
        </div>
        <span class="link-text">Ouvir</span>
        <div class="arrow-container">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </a>

      <!-- 4. PlaylistGen -->
      <a href="https://lpdasemana.com.br/gerador.html" class="link-card" id="link-playlist-gen" target="_blank" rel="noopener noreferrer">
        <div class="icon-container">
          <!-- Playlist/Music List SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>

        <div class="arrow-container">

            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </a>

      <!-- 5. LP da Semana -->
      <a href="https://lpdasemana.com.br" class="link-card" id="link-lp-da-semana" target="_blank" rel="noopener noreferrer">
        <div class="icon-container">
          <!-- Calendar Star SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <polygon points="12 12 13 14 16 14 14 15 15 18 12 16 9 18 10 15 8 14 11 14"></polygon>
          </svg>
        </div>
        <span class="link-text">LP da Semana</span>
        <div class="arrow-container">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </a>

      <!-- 6. Investify -->
      <a href="http://150.136.207.62:5001/" class="link-card" id="link-investify" target="_blank" rel="noopener noreferrer">
        <div class="icon-container">
          <!-- Finance Stock Chart SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
        </div>
        <span class="link-text">Investify</span>
        <div class="arrow-container">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

          </svg>

    <!-- Footer -->
    <div class="profile-footer">
      <p>&copy; 2026 Herivelto Gabriel</p>
    </div>
